name: Publish v0.1.0 Tag After Green Main

on:
  workflow_run:
    workflows:
      - JARVIS Validation
      - Sovereign Security Protocol v13 (SSP-v13) Audit
    types:
      - completed

permissions:
  actions: write
  contents: write

jobs:
  tag:
    name: Tag or release exact green commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Require green main and resolve immutable release target
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: v0.1.0
        run: |
          set -euo pipefail

          git fetch origin main --tags --force
          main_sha="$(git rev-parse origin/main)"
          if [[ "$main_sha" != "$SHA" ]]; then
            echo "Candidate $SHA is no longer main HEAD ($main_sha); no release action will run."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "release_complete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          require_green_pair() {
            local target_sha="$1"
            local runs_json validation security
            runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$target_sha&event=push&per_page=100")"
            validation="$(printf '%s' "$runs_json" | jq -r '[.workflow_runs[] | select(.name == "JARVIS Validation" and .head_branch == "main")][0].conclusion // ""')"
            security="$(printf '%s' "$runs_json" | jq -r '[.workflow_runs[] | select(.name == "Sovereign Security Protocol v13 (SSP-v13) Audit" and .head_branch == "main")][0].conclusion // ""')"

            echo "Required CI for $target_sha: validation=${validation:-pending}, security=${security:-pending}"
            [[ "$validation" == "success" && "$security" == "success" ]]
          }

          if ! require_green_pair "$SHA"; then
            echo "Both required workflows are not green on current main yet. The peer workflow completion will retry."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "release_complete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          peeled="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')"
          direct="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          existing="${peeled:-$direct}"

          if [[ -n "$existing" ]]; then
            release_sha="$existing"
            create_tag=false
            echo "Immutable tag $TAG already exists at $release_sha; it will not be moved."
          else
            release_sha="$SHA"
            create_tag=true
            echo "Tag $TAG does not exist; current green main $SHA is the release target."
          fi

          if ! require_green_pair "$release_sha"; then
            echo "Release target $release_sha does not have both required green main push workflows."
            exit 1
          fi

          release_complete=false
          if release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>/dev/null)"; then
            release_complete="$(printf '%s' "$release_json" | jq -r --arg sha "$release_sha" '
              ([.assets[].name] | index("context-budget.json") != null) and
              ([.assets[].name] | index("phase-29-release-oci.json") != null) and
              ([.assets[].name] | index("RELEASE_EVIDENCE.md") != null) and
              ((.body // "") | contains("Tag: v0.1.0")) and
              ((.body // "") | contains("Commit: " + $sha)) and
              (((.body // "") | contains("$env:RELEASE_TAG")) | not) and
              (((.body // "") | contains("$env:RELEASE_SHA")) | not)
            ')"

            if [[ "$release_complete" == "true" ]]; then
              echo "GitHub Release for $TAG already has all required evidence; nothing to dispatch."
              echo "release_ready=false" >> "$GITHUB_OUTPUT"
              echo "create_tag=false" >> "$GITHUB_OUTPUT"
              echo "release_complete=true" >> "$GITHUB_OUTPUT"
              echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "GitHub Release for $TAG exists but evidence is incomplete; dispatching a repair run."
          else
            echo "GitHub Release for $TAG does not exist; dispatching initial publication."
          fi

          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"
          echo "release_ready=true" >> "$GITHUB_OUTPUT"
          echo "release_complete=false" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Create immutable v0.1.0 tag
        if: steps.gate.outputs.create_tag == 'true'
        shell: bash
        env:
          SHA: ${{ steps.gate.outputs.release_sha }}
          TAG: v0.1.0
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "J.A.R.V.I.S. v0.1.0 — Cognitive Runtime Foundation"
          git push origin "refs/tags/$TAG"

      - name: Dispatch exact-tag release workflow
        if: steps.gate.outputs.release_ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0
          RELEASE_SHA: ${{ steps.gate.outputs.release_sha }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$TAG" \
            -f expected_sha="$RELEASE_SHA"
          echo "Dispatched release.yml for $TAG -> $RELEASE_SHA"
