name: JARVIS v0.1.0 Release

on:
  push:
    tags:
      - 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Verify, package and publish v0.1.0
    runs-on: windows-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate portable runtime on the exact tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release-artifacts -Force | Out-Null

          python run_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python jarvis.py --doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python jarvis.py --test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $benchmark = python benchmarks/context_budget_benchmark.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $benchmark | Write-Host
          $benchmark | Set-Content -Path release-artifacts/context-budget.json -Encoding utf8

          python tooling/audit_pre_publish_security.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage legacy registry layout
        shell: powershell
        run: |
          if (-not (Test-Path 'E:\')) {
            subst E: $env:RUNNER_TEMP
          }
          $legacyRoot = 'E:\.skill-registry'
          if (Test-Path $legacyRoot) {
            Remove-Item -Path $legacyRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $legacyRoot -Force | Out-Null
          Get-ChildItem -Force | ForEach-Object {
            if ($_.Name -ne '.git') {
              Copy-Item -Path $_.FullName -Destination $legacyRoot -Recurse -Force
            }
          }
          Write-Host "Legacy release-validation root: $legacyRoot"

      - name: Verify legacy bootstrap and OCI packaging
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location 'E:\.skill-registry'
          ./tooling/Bootstrap.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-OciDistributionTests.ps1 `
            -RegistryRoot $PWD `
            -OutputPath "$PWD\reports\phase-29-release-oci.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item `
            -Path "$PWD\reports\phase-29-release-oci.json" `
            -Destination "$env:GITHUB_WORKSPACE\release-artifacts\phase-29-release-oci.json" `
            -Force

      - name: Generate release evidence
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $runUrl = "https://github.com/$env:REPOSITORY/actions/runs/$env:RELEASE_RUN_ID"
          $evidence = @"
          # J.A.R.V.I.S. v0.1.0 — Release Evidence

          - Tag: `$env:RELEASE_TAG`
          - Commit: `$env:RELEASE_SHA`
          - Release workflow: $runUrl
          - Portable Python master battery: PASS on the exact tagged commit
          - Public launcher doctor/self-test: PASS on the exact tagged commit
          - Context-budget benchmark: PASS; raw JSON attached as `context-budget.json`
          - Canonical pre-publish audit: PASS on the exact tagged commit
          - Legacy bootstrap + OCI packaging suite: PASS; report attached as `phase-29-release-oci.json`

          The release is created only after all commands above return success.
          "@
          $evidence | Set-Content -Path release-artifacts/RELEASE_EVIDENCE.md -Encoding utf8

          Get-Content docs/launch/RELEASE_v0.1.0.md | Set-Content -Path release-body.md -Encoding utf8
          Add-Content -Path release-body.md -Value "`n---`n" -Encoding utf8
          Get-Content release-artifacts/RELEASE_EVIDENCE.md | Add-Content -Path release-body.md -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: J.A.R.V.I.S. v0.1.0 — Cognitive Runtime Foundation
          body_path: release-body.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-artifacts/context-budget.json
            release-artifacts/phase-29-release-oci.json
            release-artifacts/RELEASE_EVIDENCE.md
