name: JARVIS Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  portable-runtime:
    name: Portable Runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Portable Python Master Battery
        run: python run_tests.py

      - name: Validate Public Launcher
        run: |
          python jarvis.py --doctor
          python jarvis.py --test

      - name: Run Reproducible Context Budget Benchmark
        run: python benchmarks/context_budget_benchmark.py

      - name: Run Pre-Publish Security Audit
        run: python tooling/audit_pre_publish_security.py

  legacy-governance:
    name: Legacy Registry Governance (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage legacy E drive layout
        shell: powershell
        run: |
          if (-not (Test-Path 'E:\')) {
            subst E: $env:RUNNER_TEMP
          }
          $legacyRoot = 'E:\.skill-registry'
          if (Test-Path $legacyRoot) {
            Remove-Item -Path $legacyRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $legacyRoot -Force | Out-Null
          Get-ChildItem -Force | ForEach-Object {
            if ($_.Name -ne '.git') {
              Copy-Item -Path $_.FullName -Destination $legacyRoot -Recurse -Force
            }
          }
          Write-Host "Legacy validation root: $legacyRoot"

      - name: Bootstrap and governance suites
        shell: powershell
        run: |
          Set-Location 'E:\.skill-registry'
          ./tooling/Bootstrap.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-DistributionReconTests.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-GitHubIntelligenceReconTests.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-DistributionEngineTests.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-ResolutionEngineTests.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-OciDistributionTests.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-FederationTests.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-McpApiGatewayTests.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-SidecarTests.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-PackagingTests.ps1 -RegistryRoot $PWD

      - name: Repository Hygiene and Secret Sanitization Scan
        shell: powershell
        run: |
          Set-Location 'E:\.skill-registry'
          $forbiddenPatterns = @(
            'ghp_[A-Za-z0-9_]{36}',
            'github_pat_[A-Za-z0-9_]{82}',
            'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY',
            'AKIA[0-9A-Z]{16}'
          )
          $files = Get-ChildItem -Path . -Recurse -File -Exclude *.log,*.tar.gz
          foreach ($f in $files) {
            $content = [System.IO.File]::ReadAllText($f.FullName)
            foreach ($p in $forbiddenPatterns) {
              if ($content -match $p) {
                Write-Error "Secret pattern $p found in $($f.FullName)"
                exit 1
              }
            }
          }
          Write-Host 'Sanitization Scan: PASSED (Zero forbidden secret patterns found)'
