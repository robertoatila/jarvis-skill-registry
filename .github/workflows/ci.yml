name: JARVIS Validation

on:
  push:
    branches: [ main, master, 'release/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  portable-runtime:
    name: Portable Runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Portable Python Master Battery
        run: python run_tests.py

      - name: Validate Public Launcher
        run: |
          python jarvis.py --doctor
          python jarvis.py --test

      - name: Verify Public Quickstart Startup
        run: python tooling/quickstart_verifier.py --json-output reports/quickstart-${{ matrix.os }}.json

      - name: Upload Quickstart Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickstart-${{ matrix.os }}
          path: reports/quickstart-${{ matrix.os }}.json
          if-no-files-found: ignore

      - name: Run Reproducible Context Budget Benchmark
        run: python benchmarks/context_budget_benchmark.py

      - name: Run Pre-Publish Security Audit
        run: python tooling/audit_pre_publish_security.py


  browser-hud-smoke:
    name: Browser HUD Smoke (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright test dependency
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate browser JavaScript parse
        run: |
          node --check ui/jarvis.js
          node --check ui/mark-liv-cockpit.js
          node --check ui/service-worker.js
          node --check tests/browser/hud-smoke.spec.cjs

      - name: Run Playwright HUD smoke
        run: npm run test:browser

  legacy-governance:
    name: Legacy Registry Governance (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Stage legacy E drive layout
        shell: powershell
        run: |
          if (-not (Test-Path 'E:\')) {
            subst E: $env:RUNNER_TEMP
          }
          $legacyRoot = 'E:\.skill-registry'
          if (Test-Path $legacyRoot) {
            Remove-Item -Path $legacyRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $legacyRoot -Force | Out-Null
          Get-ChildItem -Force | ForEach-Object {
            if ($_.Name -ne '.git') {
              Copy-Item -Path $_.FullName -Destination $legacyRoot -Recurse -Force
            }
          }
          Write-Host "Legacy validation root: $legacyRoot"

      - name: Bootstrap and governance suites
        shell: powershell
        run: |
          Set-Location 'E:\.skill-registry'
          ./tooling/Bootstrap.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-DistributionReconTests.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-GitHubIntelligenceReconTests.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-DistributionEngineTests.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-ResolutionEngineTests.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-OciDistributionTests.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-FederationTests.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-McpApiGatewayTests.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-SidecarTests.ps1 -RegistryRoot $PWD
          & ./tests/Invoke-PackagingTests.ps1 -RegistryRoot $PWD

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node for UI security checks
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run isolated runtime and UI regression suite
        shell: powershell
        run: |
          Set-Location 'E:\.skill-registry'
          python -B tooling/validate_isolated.py --report reports/ci-runtime.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ui/jarvis.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Canonical Pre-Publish Security Audit
        shell: powershell
        run: |
          Set-Location 'E:\.skill-registry'
          python tooling/audit_pre_publish_security.py

      - name: Repository Hygiene & Secret Sanitization Scan
        shell: powershell
        run: |
          Set-Location 'E:\.skill-registry'
          $forbiddenPatterns = @(
            'ghp_[A-Za-z0-9_]{36}',
            'github_pat_[A-Za-z0-9_]{82}',
            'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY',
            'AKIA[0-9A-Z]{16}'
          )
          $files = Get-ChildItem -Path . -Recurse -File -Exclude .git,*.log,*.tar.gz
          foreach ($f in $files) {
            $content = [System.IO.File]::ReadAllText($f.FullName)
            foreach ($p in $forbiddenPatterns) {
              if ($content -match $p) {
                Write-Error "Secret pattern $p found in $($f.FullName)"
                exit 1
              }
            }
          }
          Write-Host "Sanitization Scan: PASSED (Zero secrets found)"

