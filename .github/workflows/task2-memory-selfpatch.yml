name: Task 2 Memory Contract Patch

on:
  push:
    branches:
      - v0.2/governor-context-memory-routing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: v0.2/governor-context-memory-routing
          fetch-depth: 0

      - name: Apply memory contract changes
        shell: bash
        run: python -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')))"

      - name: Commit production change and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/task2-memory-selfpatch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooling/agentic/memory.py tests/test_agentic_v020_memory_contracts.py
          git commit -m "feat: make durable memory admission provenance-first"
          git push origin HEAD:v0.2/governor-context-memory-routing
