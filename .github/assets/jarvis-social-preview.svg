<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="J.A.R.V.I.S. Social Preview">
  <defs>
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <linearGradient id="spCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74cdff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="spCardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(116, 205, 255, 0.35)" />
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0.08)" />
    </linearGradient>
    <radialGradient id="spGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(116, 205, 255, 0.12)" />
      <stop offset="60%" stop-color="rgba(99, 102, 241, 0.04)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <filter id="spSubtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#spBg)" stroke="rgba(116, 205, 255, 0.18)" stroke-width="1" />
  <rect width="1200" height="630" fill="url(#spGlow)" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', Roboto, sans-serif">
    <!-- Status Pill -->
    <g transform="translate(60, 55)">
      <rect width="290" height="32" rx="16" fill="rgba(10, 18, 30, 0.85)" stroke="rgba(116, 205, 255, 0.28)" stroke-width="1" />
      <circle cx="18" cy="16" r="4" fill="#34d399" filter="url(#spSubtleGlow)" />
      <text x="32" y="21" font-size="11" fill="#74cdff" font-weight="700" letter-spacing="1.8" font-family="'JetBrains Mono', monospace">SOVEREIGN RUNTIME // V0.2.0</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="175" font-size="78" fill="#ffffff" font-weight="900" letter-spacing="-2.5">J.A.R.V.I.S.</text>
    <text x="62" y="218" font-size="20" fill="#74cdff" font-weight="700" letter-spacing="2.8">AUTONOMOUS COGNITIVE CONTROL PLANE</text>
    <text x="62" y="258" font-size="16" fill="#94a3b8" font-weight="400">Deterministic local-first engineering runtime with mathematical evidence gates.</text>

    <!-- Metric Cards 2x2 Grid -->
    <g transform="translate(60, 305)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="92" rx="12" fill="rgba(11, 19, 33, 0.75)" stroke="url(#spCardBorder)" stroke-width="1" />
        <text x="20" y="40" font-size="28" fill="#ffffff" font-weight="800" font-family="'JetBrains Mono', monospace">394</text>
        <text x="20" y="66" font-size="13" fill="#74cdff" font-weight="600">Governed Skills Fleet</text>
        <text x="20" y="82" font-size="10" fill="#64748b">5 Tactical Squadrons</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(230, 0)">
        <rect width="230" height="92" rx="12" fill="rgba(11, 19, 33, 0.75)" stroke="url(#spCardBorder)" stroke-width="1" />
        <text x="20" y="40" font-size="28" fill="#74cdff" font-weight="800" font-family="'JetBrains Mono', monospace">42,872</text>
        <text x="20" y="66" font-size="13" fill="#94a3b8" font-weight="600">Curated Repositories</text>
        <text x="20" y="82" font-size="10" fill="#64748b">SQLite FTS5 Fast Search</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(0, 108)">
        <rect width="210" height="92" rx="12" fill="rgba(11, 19, 33, 0.75)" stroke="url(#spCardBorder)" stroke-width="1" />
        <text x="20" y="40" font-size="28" fill="#a78bfa" font-weight="800" font-family="'JetBrains Mono', monospace">5,870+</text>
        <text x="20" y="66" font-size="13" fill="#94a3b8" font-weight="600">Vault Memory Nodes</text>
        <text x="20" y="82" font-size="10" fill="#64748b">Obsidian Cognitive Fabric</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(230, 108)">
        <rect width="230" height="92" rx="12" fill="rgba(11, 19, 33, 0.75)" stroke="url(#spCardBorder)" stroke-width="1" />
        <text x="20" y="40" font-size="26" fill="#34d399" font-weight="800" font-family="'JetBrains Mono', monospace">798 PASS</text>
        <text x="20" y="66" font-size="13" fill="#94a3b8" font-weight="600">Master Test Battery</text>
        <text x="20" y="82" font-size="10" fill="#34d399">111 Suites All Green</text>
      </g>
    </g>

    <!-- Bottom Line -->
    <g transform="translate(62, 555)">
      <text font-size="11" fill="#64748b" font-family="'JetBrains Mono', monospace">CANONICAL: HTTPS://JARVIS-SKILL-REGISTRY.VERCEL.APP</text>
    </g>
  </g>

  <!-- Right Side Arc Reactor -->
  <g transform="translate(940, 320)">
    <circle cx="0" cy="0" r="190" fill="none" stroke="rgba(116, 205, 255, 0.12)" stroke-width="1.5" stroke-dasharray="3 6" />
    <circle cx="0" cy="0" r="150" fill="none" stroke="rgba(59, 130, 246, 0.22)" stroke-width="1" />
    <circle cx="0" cy="0" r="115" fill="none" stroke="rgba(116, 205, 255, 0.38)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="75" fill="rgba(10, 18, 30, 0.9)" stroke="#74cdff" stroke-width="2" />

    <circle cx="0" cy="0" r="28" fill="url(#spCore)" filter="url(#spSubtleGlow)" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" />

    <circle cx="-85" cy="-65" r="7" fill="#f43f5e" />
    <line x1="0" y1="0" x2="-85" y2="-65" stroke="#f43f5e" stroke-width="1" opacity="0.5" />

    <circle cx="80" cy="-75" r="7" fill="#a78bfa" />
    <line x1="0" y1="0" x2="80" y2="-75" stroke="#a78bfa" stroke-width="1" opacity="0.5" />

    <circle cx="110" cy="48" r="7" fill="#74cdff" />
    <line x1="0" y1="0" x2="110" y2="48" stroke="#74cdff" stroke-width="1" opacity="0.5" />

    <circle cx="-18" cy="115" r="7" fill="#3b82f6" />
    <line x1="0" y1="0" x2="-18" y2="115" stroke="#3b82f6" stroke-width="1" opacity="0.5" />

    <circle cx="-105" cy="42" r="7" fill="#f59e0b" />
    <line x1="0" y1="0" x2="-105" y2="42" stroke="#f59e0b" stroke-width="1" opacity="0.5" />

    <text x="0" y="165" font-size="12" fill="#74cdff" font-weight="700" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="1.5">MARK-LIV COCKPIT (:8899)</text>
  </g>
</svg>