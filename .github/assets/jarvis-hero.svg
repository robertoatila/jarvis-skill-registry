<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-label="J.A.R.V.I.S. Autonomous Cognitive Runtime">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <linearGradient id="coreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74cdff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(116, 205, 255, 0.35)" />
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0.08)" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="80%" cy="50%" r="45%">
      <stop offset="0%" stop-color="rgba(116, 205, 255, 0.12)" />
      <stop offset="60%" stop-color="rgba(99, 102, 241, 0.04)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="520" rx="16" fill="url(#bgGradient)" stroke="rgba(116, 205, 255, 0.18)" stroke-width="1" />
  <rect width="1400" height="520" fill="url(#ambientGlow)" />

  <!-- Subtle Precision Dot Matrix -->
  <g opacity="0.12" fill="#74cdff">
    <circle cx="80" cy="80" r="1"/><circle cx="140" cy="80" r="1"/><circle cx="200" cy="80" r="1"/><circle cx="260" cy="80" r="1"/>
    <circle cx="80" cy="140" r="1"/><circle cx="140" cy="140" r="1"/><circle cx="200" cy="140" r="1"/><circle cx="260" cy="140" r="1"/>
    <circle cx="80" cy="200" r="1"/><circle cx="140" cy="200" r="1"/><circle cx="200" cy="200" r="1"/><circle cx="260" cy="200" r="1"/>
    <circle cx="80" cy="260" r="1"/><circle cx="140" cy="260" r="1"/><circle cx="200" cy="260" r="1"/><circle cx="260" cy="260" r="1"/>
    <circle cx="80" cy="320" r="1"/><circle cx="140" cy="320" r="1"/><circle cx="200" cy="320" r="1"/><circle cx="260" cy="320" r="1"/>
    <circle cx="80" cy="380" r="1"/><circle cx="140" cy="380" r="1"/><circle cx="200" cy="380" r="1"/><circle cx="260" cy="380" r="1"/>
    <circle cx="80" cy="440" r="1"/><circle cx="140" cy="440" r="1"/><circle cx="200" cy="440" r="1"/><circle cx="260" cy="440" r="1"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', Roboto, sans-serif">
    <!-- System Status Pill -->
    <g transform="translate(60, 48)">
      <rect width="280" height="30" rx="15" fill="rgba(10, 18, 30, 0.85)" stroke="rgba(116, 205, 255, 0.28)" stroke-width="1" />
      <circle cx="18" cy="15" r="4" fill="#34d399" filter="url(#subtleGlow)" />
      <text x="32" y="20" font-size="11" fill="#74cdff" font-weight="700" letter-spacing="1.8" font-family="'JetBrains Mono', monospace">SOVEREIGN RUNTIME // V0.2.0</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="160" font-size="74" fill="#ffffff" font-weight="900" letter-spacing="-2.5">J.A.R.V.I.S.</text>
    <text x="62" y="200" font-size="18" fill="#74cdff" font-weight="700" letter-spacing="2.8">AUTONOMOUS COGNITIVE CONTROL PLANE</text>
    <text x="62" y="238" font-size="16" fill="#94a3b8" font-weight="400">Deterministic local-first engineering runtime with mathematical evidence gates.</text>

    <!-- 4 High-Precision Telemetry Cards -->
    <g transform="translate(60, 276)">
      <!-- Card 1: Skills Fleet -->
      <g transform="translate(0, 0)">
        <rect width="170" height="86" rx="12" fill="rgba(11, 19, 33, 0.75)" stroke="url(#cardBorder)" stroke-width="1" />
        <text x="18" y="36" font-size="26" fill="#ffffff" font-weight="800" font-family="'JetBrains Mono', monospace">394</text>
        <text x="18" y="60" font-size="12" fill="#74cdff" font-weight="600">Governed Skills Fleet</text>
        <text x="18" y="74" font-size="10" fill="#64748b">5 Tactical Squadrons</text>
      </g>

      <!-- Card 2: FTS5 Radar -->
      <g transform="translate(185, 0)">
        <rect width="205" height="86" rx="12" fill="rgba(11, 19, 33, 0.75)" stroke="url(#cardBorder)" stroke-width="1" />
        <text x="18" y="36" font-size="26" fill="#74cdff" font-weight="800" font-family="'JetBrains Mono', monospace">42,872</text>
        <text x="18" y="60" font-size="12" fill="#94a3b8" font-weight="600">Curated Repositories</text>
        <text x="18" y="74" font-size="10" fill="#64748b">SQLite FTS5 Fast Search</text>
      </g>

      <!-- Card 3: Cognitive Vault -->
      <g transform="translate(405, 0)">
        <rect width="185" height="86" rx="12" fill="rgba(11, 19, 33, 0.75)" stroke="url(#cardBorder)" stroke-width="1" />
        <text x="18" y="36" font-size="26" fill="#a78bfa" font-weight="800" font-family="'JetBrains Mono', monospace">5,870+</text>
        <text x="18" y="60" font-size="12" fill="#94a3b8" font-weight="600">Vault Memory Nodes</text>
        <text x="18" y="74" font-size="10" fill="#64748b">Obsidian Associative Fabric</text>
      </g>

      <!-- Card 4: Verification Tests -->
      <g transform="translate(605, 0)">
        <rect width="175" height="86" rx="12" fill="rgba(11, 19, 33, 0.75)" stroke="url(#cardBorder)" stroke-width="1" />
        <text x="18" y="36" font-size="24" fill="#34d399" font-weight="800" font-family="'JetBrains Mono', monospace">798 PASS</text>
        <text x="18" y="60" font-size="12" fill="#94a3b8" font-weight="600">Master Test Battery</text>
        <text x="18" y="74" font-size="10" fill="#34d399">111 Suites All Green</text>
      </g>
    </g>

    <!-- Bottom Architecture Line -->
    <g transform="translate(62, 420)">
      <text font-size="11" fill="#475569" font-family="'JetBrains Mono', monospace" letter-spacing="1.2">
        BOUNDED UTF-8 CONTEXT • SHA-256 MERKLE ROOT • FAIL-CLOSED SSP-v13.4 • ZERO CLOUD LOCK-IN
      </text>
      <text y="26" font-size="11" fill="#74cdff" font-family="'JetBrains Mono', monospace" font-weight="600">
        PRODUCTION PORTAL: HTTPS://JARVIS-SKILL-REGISTRY.VERCEL.APP
      </text>
    </g>
  </g>

  <!-- Right Side Stark-Grade Holographic Reactor Core -->
  <g transform="translate(1120, 260)">
    <!-- Ambient Ring Glow -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="rgba(116, 205, 255, 0.15)" stroke-width="1.5" stroke-dasharray="3 6" />
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(59, 130, 246, 0.25)" stroke-width="1" />
    <circle cx="0" cy="0" r="105" fill="none" stroke="rgba(116, 205, 255, 0.4)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="70" fill="rgba(10, 18, 30, 0.9)" stroke="#74cdff" stroke-width="2" />

    <!-- Center Reactor Core -->
    <circle cx="0" cy="0" r="26" fill="url(#coreGradient)" filter="url(#subtleGlow)" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" />

    <!-- Orbital Squadron Satellites -->
    <!-- Squad 1: Cyberspace (Crimson/Red) -->
    <circle cx="-80" cy="-60" r="6" fill="#f43f5e" />
    <line x1="0" y1="0" x2="-80" y2="-60" stroke="#f43f5e" stroke-width="1" opacity="0.5" />

    <!-- Squad 2: Hyperion (Purple) -->
    <circle cx="75" cy="-70" r="6" fill="#a78bfa" />
    <line x1="0" y1="0" x2="75" y2="-70" stroke="#a78bfa" stroke-width="1" opacity="0.5" />

    <!-- Squad 3: FullStack (Cobalt Ice) -->
    <circle cx="100" cy="45" r="6" fill="#74cdff" />
    <line x1="0" y1="0" x2="100" y2="45" stroke="#74cdff" stroke-width="1" opacity="0.5" />

    <!-- Squad 4: Systems (Electric Blue) -->
    <circle cx="-15" cy="105" r="6" fill="#3b82f6" />
    <line x1="0" y1="0" x2="-15" y2="105" stroke="#3b82f6" stroke-width="1" opacity="0.5" />

    <!-- Squad 5: Radar (Amber) -->
    <circle cx="-95" cy="40" r="6" fill="#f59e0b" />
    <line x1="0" y1="0" x2="-95" y2="40" stroke="#f59e0b" stroke-width="1" opacity="0.5" />

    <!-- Coordinates Label -->
    <text x="0" y="150" font-size="11" fill="#74cdff" font-weight="700" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="1.5">MARK-LIV COCKPIT // :8899</text>
  </g>
</svg>