<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc"><title id="title">Planned Memory Fabric</title><desc id="desc">Four planned memory levels with admission, ordered retrieval, compaction, validation and an Obsidian projection. Existing vault support is not this complete architecture.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="870" rx="14" fill="#080f19" stroke="#080f19" /><g opacity="0.22"><path d="M0 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M64 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M128 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M192 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M256 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M320 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M384 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M448 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M512 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M576 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M640 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M704 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M768 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M832 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M896 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M960 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M1024 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M1088 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M1152 0 V870" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 0 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 64 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 128 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 192 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 256 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 320 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 384 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 448 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 512 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 576 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 640 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 704 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 768 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 832 H1200" fill="none" stroke="#2b455d" stroke-width="1" /></g><text x="48" y="49" font-size="14" fill="#5de0ec" font-weight="600" letter-spacing="2">MEMORY FABRIC / PLANNED TARGET</text><text x="48" y="98" font-size="34" fill="#edf5ff" font-weight="600" >Memory, with admission and provenance</text><text x="48" y="134" font-size="17" fill="#a9bfd1" font-weight="400" >Validated machine records are authoritative. Obsidian is the human-readable projection.</text><rect x="48" y="181" width="258" height="207" rx="14" fill="#101e2e" stroke="#a9bfd1" stroke-dasharray="6 6"/><text x="70" y="213" font-size="11" fill="#a9bfd1" font-weight="600" letter-spacing="1">PLANNED</text><text x="70" y="247" font-size="22" fill="#edf5ff" font-weight="600" >Working</text><text x="70" y="279" font-size="16" fill="#a9bfd1" font-weight="400" >Transient mission context</text><text x="70" y="304" font-size="16" fill="#a9bfd1" font-weight="400" >Compact structured state</text><rect x="330" y="181" width="258" height="207" rx="14" fill="#101e2e" stroke="#a9bfd1" stroke-dasharray="6 6"/><text x="352" y="213" font-size="11" fill="#a9bfd1" font-weight="600" letter-spacing="1">PLANNED</text><text x="352" y="247" font-size="22" fill="#edf5ff" font-weight="600" >Episodic</text><text x="352" y="279" font-size="16" fill="#a9bfd1" font-weight="400" >Attempts and decisions</text><text x="352" y="304" font-size="16" fill="#a9bfd1" font-weight="400" >Outcomes and recovery</text><rect x="612" y="181" width="258" height="207" rx="14" fill="#101e2e" stroke="#a9bfd1" stroke-dasharray="6 6"/><text x="634" y="213" font-size="11" fill="#a9bfd1" font-weight="600" letter-spacing="1">PLANNED</text><text x="634" y="247" font-size="22" fill="#edf5ff" font-weight="600" >Semantic</text><text x="634" y="279" font-size="16" fill="#a9bfd1" font-weight="400" >Repository / environment</text><text x="634" y="304" font-size="16" fill="#a9bfd1" font-weight="400" >Facts, scope and freshness</text><rect x="894" y="181" width="258" height="207" rx="14" fill="#101e2e" stroke="#a9bfd1" stroke-dasharray="6 6"/><text x="916" y="213" font-size="11" fill="#a9bfd1" font-weight="600" letter-spacing="1">PLANNED</text><text x="916" y="247" font-size="22" fill="#edf5ff" font-weight="600" >Procedural</text><text x="916" y="279" font-size="16" fill="#a9bfd1" font-weight="400" >Verified workflows</text><text x="916" y="304" font-size="16" fill="#a9bfd1" font-weight="400" >Heuristics and promotion</text><rect x="48" y="427" width="1104" height="83" rx="14" fill="#101e2e" stroke="#2b455d" /><text x="70" y="460" font-size="14" fill="#5de0ec" font-weight="600" >ADMIT</text><text x="70" y="488" font-size="17" fill="#edf5ff" font-weight="400" >Value → evidence → provenance → confidence → deduplicate → conflict check → classify → store</text><rect x="48" y="530" width="1104" height="83" rx="14" fill="#101e2e" stroke="#2b455d" /><text x="70" y="563" font-size="14" fill="#5de0ec" font-weight="600" >RETRIEVE</text><text x="70" y="591" font-size="18" fill="#edf5ff" font-weight="400" >Exact ID → repository graph → metadata → lexical → semantic → broader search</text><path d="M600 389 V427 M600 510 V530 M600 613 V651" fill="none" stroke="#5de0ec" stroke-width="2" /><rect x="48" y="651" width="534" height="102" rx="14" fill="#101e2e" stroke="#2b455d" /><text x="70" y="686" font-size="14" fill="#5de0ec" font-weight="600" >COMPACT &amp; VALIDATE</text><text x="70" y="720" font-size="17" fill="#edf5ff" font-weight="400" >Facts + references; retain the separate audit trail</text><rect x="610" y="651" width="542" height="102" rx="14" fill="#101e2e" stroke="#2b455d" /><text x="632" y="686" font-size="14" fill="#5de0ec" font-weight="600" >PROJECT TO OBSIDIAN</text><text x="632" y="720" font-size="17" fill="#edf5ff" font-weight="400" >Aggregate → validate → publish navigable notes</text><text x="48" y="816" font-size="17" fill="#a9bfd1" font-weight="400" >Freshness, scope, environment and contradiction history travel with every durable record.</text></g></svg>
