<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Runtime architecture and maturity</title><desc id="desc">Three maturity states distinguish tested unit behavior, partially integrated components and planned cognitive systems. Lines express target dependency, not live data flow.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="900" rx="14" fill="#080f19" stroke="#080f19" /><g opacity="0.22"><path d="M0 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M64 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M128 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M192 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M256 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M320 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M384 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M448 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M512 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M576 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M640 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M704 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M768 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M832 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M896 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M960 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M1024 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M1088 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M1152 0 V900" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 0 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 64 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 128 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 192 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 256 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 320 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 384 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 448 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 512 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 576 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 640 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 704 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 768 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 832 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 896 H1200" fill="none" stroke="#2b455d" stroke-width="1" /></g><text x="48" y="49" font-size="14" fill="#5de0ec" font-weight="600" letter-spacing="2">ARCHITECTURE / BASELINE + DIRECTION</text><text x="48" y="98" font-size="34" fill="#edf5ff" font-weight="600" >Runtime architecture</text><text x="48" y="134" font-size="17" fill="#a9bfd1" font-weight="400" >Status applies to the stated scope. A passing unit test does not certify runtime integration.</text><rect x="48" y="175" width="352" height="199" rx="14" fill="#101e2e" stroke="#5de0ec" /><text x="70" y="207" font-size="11" fill="#5de0ec" font-weight="600" letter-spacing="1">VALIDATED / UNIT SCOPE</text><text x="70" y="241" font-size="22" fill="#edf5ff" font-weight="600" >Contracts &amp; graph</text><text x="70" y="273" font-size="16" fill="#a9bfd1" font-weight="400" >Attempt serialization; DAG invariants</text><text x="70" y="298" font-size="16" fill="#a9bfd1" font-weight="400" >84 selected tests across eight suites</text><rect x="424" y="175" width="352" height="199" rx="14" fill="#101e2e" stroke="#84b5ff" stroke-dasharray="12 5 2 5"/><text x="446" y="207" font-size="11" fill="#84b5ff" font-weight="600" letter-spacing="1">PARTIAL</text><text x="446" y="241" font-size="22" fill="#edf5ff" font-weight="600" >Execution &amp; evidence</text><text x="446" y="273" font-size="16" fill="#a9bfd1" font-weight="400" >Policy, state, scheduler, verifier</text><text x="446" y="298" font-size="16" fill="#a9bfd1" font-weight="400" >Adapter and attempt wiring incomplete</text><rect x="800" y="175" width="352" height="199" rx="14" fill="#101e2e" stroke="#84b5ff" stroke-dasharray="12 5 2 5"/><text x="822" y="207" font-size="11" fill="#84b5ff" font-weight="600" letter-spacing="1">PARTIAL</text><text x="822" y="241" font-size="22" fill="#edf5ff" font-weight="600" >Human observability</text><text x="822" y="273" font-size="16" fill="#a9bfd1" font-weight="400" >HUD and Markdown vault exist</text><text x="822" y="298" font-size="16" fill="#a9bfd1" font-weight="400" >Live behavior not validated here</text><rect x="48" y="421" width="352" height="199" rx="14" fill="#101e2e" stroke="#a9bfd1" stroke-dasharray="6 6"/><text x="70" y="453" font-size="11" fill="#a9bfd1" font-weight="600" letter-spacing="1">PLANNED</text><text x="70" y="487" font-size="22" fill="#edf5ff" font-weight="600" >Cognitive Governor</text><text x="70" y="519" font-size="16" fill="#a9bfd1" font-weight="400" >Budget, uncertainty and stop policy</text><text x="70" y="544" font-size="16" fill="#a9bfd1" font-weight="400" >Controls decisions; never runs tasks</text><rect x="424" y="421" width="352" height="199" rx="14" fill="#101e2e" stroke="#a9bfd1" stroke-dasharray="6 6"/><text x="446" y="453" font-size="11" fill="#a9bfd1" font-weight="600" letter-spacing="1">PLANNED</text><text x="446" y="487" font-size="22" fill="#edf5ff" font-weight="600" >Context &amp; routing</text><text x="446" y="519" font-size="16" fill="#a9bfd1" font-weight="400" >Context receipts; tool/model choice</text><text x="446" y="544" font-size="16" fill="#a9bfd1" font-weight="400" >Progressive disclosure exists today</text><rect x="800" y="421" width="352" height="199" rx="14" fill="#101e2e" stroke="#a9bfd1" stroke-dasharray="6 6"/><text x="822" y="453" font-size="11" fill="#a9bfd1" font-weight="600" letter-spacing="1">PLANNED</text><text x="822" y="487" font-size="22" fill="#edf5ff" font-weight="600" >Memory Fabric</text><text x="822" y="519" font-size="16" fill="#a9bfd1" font-weight="400" >Working / episodic / semantic</text><text x="822" y="544" font-size="16" fill="#a9bfd1" font-weight="400" >Procedural; validated vault projection</text><path d="M224 390 V408 H976 V390" fill="none" stroke="#2b455d" stroke-width="2" /><path d="M600 408 V421" fill="none" stroke="#2b455d" stroke-width="2" /><rect x="48" y="671" width="1104" height="88" rx="14" fill="#101e2e" stroke="#2b455d" /><text x="72" y="705" font-size="14" fill="#5de0ec" font-weight="600" >FOUNDATION GATE</text><text x="72" y="737" font-size="20" fill="#edf5ff" font-weight="400" >Versioned contracts → policy → durable attempts → provenance → verification → budgets</text><text x="48" y="804" font-size="15" fill="#a9bfd1" font-weight="400" >SOLID: validated unit scope     DASH-DOT: partial implementation     DASHED: planned contract</text><text x="48" y="852" font-size="17" fill="#a9bfd1" font-weight="400" >External workflows, infrastructure and federation remain gated behind local hardening.</text></g></svg>
