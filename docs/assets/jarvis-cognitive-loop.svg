<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">Target cognitive loop</title><desc id="desc">Nine sequential numbered stages from observe to adapt. This is a target lifecycle, not evidence of an operational closed loop.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="740" rx="14" fill="#080f19" stroke="#080f19" /><g opacity="0.22"><path d="M0 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M64 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M128 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M192 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M256 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M320 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M384 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M448 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M512 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M576 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M640 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M704 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M768 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M832 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M896 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M960 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M1024 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M1088 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M1152 0 V740" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 0 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 64 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 128 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 192 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 256 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 320 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 384 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 448 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 512 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 576 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 640 H1200" fill="none" stroke="#2b455d" stroke-width="1" /><path d="M0 704 H1200" fill="none" stroke="#2b455d" stroke-width="1" /></g><text x="48" y="49" font-size="14" fill="#5de0ec" font-weight="600" letter-spacing="2">TARGET LIFECYCLE / NOT LIVE TELEMETRY</text><text x="48" y="98" font-size="34" fill="#edf5ff" font-weight="600" >The cognitive execution loop</text><text x="48" y="134" font-size="17" fill="#a9bfd1" font-weight="400" >A verified outcome and a bounded learning step close the loop.</text><rect x="48" y="175" width="352" height="123" rx="14" fill="#101e2e" stroke="#2b455d" /><text x="68" y="204" font-size="12" fill="#5de0ec" font-weight="600" >01</text><text x="68" y="235" font-size="22" fill="#edf5ff" font-weight="600" >OBSERVE</text><text x="68" y="267" font-size="16" fill="#a9bfd1" font-weight="400" >Read state and intent</text><path d="M400 232 h24" fill="none" stroke="#5de0ec" stroke-width="2" /><rect x="424" y="175" width="352" height="123" rx="14" fill="#101e2e" stroke="#2b455d" /><text x="444" y="204" font-size="12" fill="#5de0ec" font-weight="600" >02</text><text x="444" y="235" font-size="22" fill="#edf5ff" font-weight="600" >PLAN</text><text x="444" y="267" font-size="16" fill="#a9bfd1" font-weight="400" >Build a scoped DAG</text><path d="M776 232 h24" fill="none" stroke="#5de0ec" stroke-width="2" /><rect x="800" y="175" width="352" height="123" rx="14" fill="#101e2e" stroke="#2b455d" /><text x="820" y="204" font-size="12" fill="#5de0ec" font-weight="600" >03</text><text x="820" y="235" font-size="22" fill="#edf5ff" font-weight="600" >RESOLVE</text><text x="820" y="267" font-size="16" fill="#a9bfd1" font-weight="400" >Select admissible resources</text><rect x="48" y="328" width="352" height="123" rx="14" fill="#101e2e" stroke="#2b455d" /><text x="68" y="357" font-size="12" fill="#5de0ec" font-weight="600" >04</text><text x="68" y="388" font-size="22" fill="#edf5ff" font-weight="600" >DELEGATE</text><text x="68" y="420" font-size="16" fill="#a9bfd1" font-weight="400" >Assign bounded work</text><path d="M400 385 h24" fill="none" stroke="#5de0ec" stroke-width="2" /><rect x="424" y="328" width="352" height="123" rx="14" fill="#101e2e" stroke="#2b455d" /><text x="444" y="357" font-size="12" fill="#5de0ec" font-weight="600" >05</text><text x="444" y="388" font-size="22" fill="#edf5ff" font-weight="600" >EXECUTE</text><text x="444" y="420" font-size="16" fill="#a9bfd1" font-weight="400" >Record a real attempt</text><path d="M776 385 h24" fill="none" stroke="#5de0ec" stroke-width="2" /><rect x="800" y="328" width="352" height="123" rx="14" fill="#101e2e" stroke="#2b455d" /><text x="820" y="357" font-size="12" fill="#5de0ec" font-weight="600" >06</text><text x="820" y="388" font-size="22" fill="#edf5ff" font-weight="600" >VERIFY</text><text x="820" y="420" font-size="16" fill="#a9bfd1" font-weight="400" >Check independent evidence</text><rect x="48" y="481" width="352" height="123" rx="14" fill="#101e2e" stroke="#2b455d" /><text x="68" y="510" font-size="12" fill="#5de0ec" font-weight="600" >07</text><text x="68" y="541" font-size="22" fill="#edf5ff" font-weight="600" >MEASURE</text><text x="68" y="573" font-size="16" fill="#a9bfd1" font-weight="400" >Record actual resource use</text><path d="M400 538 h24" fill="none" stroke="#5de0ec" stroke-width="2" /><rect x="424" y="481" width="352" height="123" rx="14" fill="#101e2e" stroke="#2b455d" /><text x="444" y="510" font-size="12" fill="#5de0ec" font-weight="600" >08</text><text x="444" y="541" font-size="22" fill="#edf5ff" font-weight="600" >LEARN</text><text x="444" y="573" font-size="16" fill="#a9bfd1" font-weight="400" >Admit supported knowledge</text><path d="M776 538 h24" fill="none" stroke="#5de0ec" stroke-width="2" /><rect x="800" y="481" width="352" height="123" rx="14" fill="#101e2e" stroke="#2b455d" /><text x="820" y="510" font-size="12" fill="#5de0ec" font-weight="600" >09</text><text x="820" y="541" font-size="22" fill="#edf5ff" font-weight="600" >ADAPT</text><text x="820" y="573" font-size="16" fill="#a9bfd1" font-weight="400" >Promote bounded changes</text><text x="48" y="687" font-size="17" fill="#5de0ec" font-weight="400" >Governor: inspect uncertainty → buy the cheapest useful evidence → continue, replan or stop.</text></g></svg>
